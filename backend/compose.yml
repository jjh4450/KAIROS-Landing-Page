# 로컬/단일 노드용 compose. 운영에선 동일한 env를 오케스트레이터로 주입.
services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: 0.38.0
    image: pb-litestream:local
    container_name: pocketbase
    restart: unless-stopped

    ports:
      - "8090:8090"
      - "127.0.0.1:9091:9091"  # metrics, 외부 노출 금지

    volumes:
      - pb_data:/pb/pb_data    # ephemeral 운영이면 이 줄 삭제

    environment:
      APP_ENV:                      ${APP_ENV:-production}

      # Litestream — SQLite WAL backup (메타데이터 → S3_BACKUP_BUCKET)
      LITESTREAM_ACCESS_KEY_ID:     ${S3_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      LITESTREAM_BUCKET:            ${S3_BACKUP_BUCKET}
      LITESTREAM_PATH:              pb
      LITESTREAM_ENDPOINT:          ${S3_ENDPOINT}
      LITESTREAM_REGION:            ${S3_REGION:-auto}

      # PocketBase file storage — pb_hooks/main.pb.js 의 onBootstrap 가 읽음
      # (첨부 이미지 등 → S3_FILES_BUCKET)
      S3_ACCESS_KEY_ID:     ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FILES_BUCKET:      ${S3_FILES_BUCKET:-}
      S3_ENDPOINT:          ${S3_ENDPOINT}
      S3_REGION:            ${S3_REGION:-auto}

      PB_ENCRYPTION_KEY:    ${PB_ENCRYPTION_KEY:-}
      GOMEMLIMIT:           ${GOMEMLIMIT:-256MiB}
      TZ:                   ${TZ:-Asia/Seoul}

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pb_data:
    name: pb_data
